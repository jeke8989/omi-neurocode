# NeuroSoft: gateway, stt, agent, claude (Claude Code CLI для чата) + Postgres и autoheal.
# Отдельный проект docker compose — не трогает Jarvis и другие контейнеры на сервере.
name: neurosoft

x-app-env: &app-env
  DATABASE_URL: postgresql://neuro:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/neuro
  AUDIO_DIR: /data/audio

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: neuro
      POSTGRES_USER: neuro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuro -d neuro"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    ports:
      - "${GATEWAY_PORT:-8090}:8000"
    volumes:
      - audio:/data/audio
      - photos:/data/photos
      - voices:/data/voices
      - whisper-models:/models   # нейроголос (модель ~130 МБ скачивается сама)
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  stt:
    build:
      context: .
      dockerfile: stt/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    volumes:
      - audio:/data/audio
      - voices:/data/voices
      - whisper-models:/models
    depends_on:
      db:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    volumes:
      - audio:/data/audio
      - photos:/data/photos
    depends_on:
      db:
        condition: service_healthy

  # Claude Code CLI для режима «Claude» в чате. Нарочно без .env: ключей сервера здесь нет,
  # только рабочая копия репозитория и deploy-ключ для git push (~/.ssh в томе claude-home).
  claude:
    build:
      context: .
      dockerfile: claude/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      CLAUDE_REPO_URL: ${CLAUDE_REPO_URL:-https://github.com/jeke8989/omi-neurocode.git}
      CLAUDE_PUSH_URL: ${CLAUDE_PUSH_URL:-git@github.com:jeke8989/omi-neurocode.git}
      CLAUDE_BRANCH: ${CLAUDE_BRANCH:-main}
      CLAUDE_MAX_MIN: ${CLAUDE_MAX_MIN:-30}
    volumes:
      - claude-home:/home/claude
      - claude-work:/work
    mem_limit: 2g
    labels:
      - "autoheal=true"

  # перезапускает контейнеры с меткой autoheal=true, если их healthcheck стал unhealthy.
  # Профиль autoheal (COMPOSE_PROFILES в .env): если на сервере уже есть свой autoheal (например, у Jarvis), выключите.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    profiles: ["autoheal"]
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 15
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  audio:
  photos:
  voices:
  whisper-models:
  claude-home:
  claude-work:
