name: Android APK

on:
  push:
    paths: ["android/**", "neurosoft.properties", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        working-directory: android
        run: |
          [ -f build.log ] || { echo "::error title=build::сборка не запустилась — см. шаги выше"; exit 0; }
          python3 - <<'PY'
          import re
          lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          out = [l for l in lines if re.match(r"^e: ", l)]
          for i, l in enumerate(lines):
              if "What went wrong" in l:
                  out += lines[i:i + 15]
          if not out:
              out = lines[-80:]
          esc = lambda x: x.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for i in range(0, min(len(out), 200), 20):
              print("::error title=build::" + "%0A".join(esc(x) for x in out[i:i + 20]))
          PY

      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Mnemo-0.2.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Mnemo-apk
          path: Mnemo-*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mnemo 0.2.${{ github.run_number }}
          files: Mnemo-*.apk
          make_latest: true
          body: |
            Установите APK на телефон (разрешите установку из этого источника). Новые версии ставятся поверх старых.
